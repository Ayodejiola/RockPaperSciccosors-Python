apiVersion: v1
kind: Namespace
metadata:
  name: guessing-game
  labels:
    app.kubernetes.io/part-of: guessing-game
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guessing-api
  namespace: guessing-game
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guessing-api
  namespace: guessing-game
  labels:
    app.kubernetes.io/name: guessing-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: guessing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guessing-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: guessing-api
      automountServiceAccountToken: false
      containers:
        - name: api
          image: acrgameuemrtz.azurecr.io/guessing-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guessing-api-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: guessing-api-secrets
                  key: redis-url
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "2"
            - name: DB_POOL_TIMEOUT
              value: "5"
            - name: REDIS_MAX_CONNECTIONS
              value: "10"
            - name: AUTO_CREATE_SCHEMA
              value: "true"
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: guessing-api
  namespace: guessing-game
  labels:
    app.kubernetes.io/name: guessing-api
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: guessing-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: guessing-api
  namespace: guessing-game
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: guessing-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: guessing-game
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9121"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: exporter
          image: oliver006/redis_exporter:v1.67.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: guessing-api-secrets
                  key: redis-url
          ports:
            - name: metrics
              containerPort: 9121
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 59000
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: guessing-game
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
