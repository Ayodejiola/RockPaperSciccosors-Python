apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-agent-read
  namespace: guessing-game
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-agent-read
  namespace: guessing-game
subjects:
  - kind: ServiceAccount
    name: incident-agent
    namespace: incident-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-agent-read
