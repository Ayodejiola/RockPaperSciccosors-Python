services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6379:6379"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://game:game@postgres:5432/game
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 2
      REDIS_MAX_CONNECTIONS: 10
      AUTO_CREATE_SCHEMA: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres-data:
